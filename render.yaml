# Render Blueprint: one web service that serves the API, WebSockets and the built web client.
# Deploy: Render dashboard → New → Blueprint → pick this repository.
#
# Free plan: no card needed, but the instance has no persistent disk and sleeps after ~15 minutes
# idle, so the database and uploads are wiped whenever it restarts, sleeps or redeploys. For real
# use, switch to `plan: starter` and add the disk shown at the bottom (see docs/DEPLOY.md).
services:
  - type: web
    name: fellowship
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start -w server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Listen on every interface, on the port Render routes traffic to.
      - key: HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "10000"
      # Email verification. Set these two in the Render dashboard (they are secrets).
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Fellowship
    # Paid plans only — keeps data across restarts:
    # disk:
    #   name: fellowship-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # and add env var FELLOWSHIP_DB=/var/data/fellowship.db
